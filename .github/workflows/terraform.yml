name: Terraform Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    
    # Fazemos o "link" das variáveis que a Action da AWS já configurou 
    # para as variáveis que o seu Terraform espera
    env:
      TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_region: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      # Passo de Plan apenas para visualização em Pull Requests
      - name: Terraform Plan (Somente PR)
        if: github.event_name == 'pull_request'
        run: terraform plan

      # --------------------------------------------------------
      # APPLY EM DUAS ETAPAS (A mágica do Bootstrap)
      # --------------------------------------------------------
      
      - name: Terraform Apply - Etapa 1 (Bootstrap EKS)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -target=module.eks -auto-approve

      - name: Terraform Apply - Etapa 2 (Configurações e Observabilidade)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve